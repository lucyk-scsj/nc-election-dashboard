name: Update election data

on:
  schedule:
    # 11:00 UTC = 6:00 or 7:00 AM Eastern (adjust as you like).
    # NCSBE refreshes absentee files daily once ballots start going out,
    # and provisional files really only matter Election Day onward --
    # feel free to add a second, more frequent cron closer to Election Day.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run data pipeline
        run: python scripts/build_data.py

      - name: Commit updated data
        run: |
          git config user.name "election-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update election data $(date -u +'%Y-%m-%d')"
          git push

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
